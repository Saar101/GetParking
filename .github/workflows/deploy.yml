name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Start Cloud Build
        id: start-build
        run: |
          BUILD_ID=$(gcloud builds submit \
            --async \
            --format='value(id)' \
            --tag gcr.io/$GCP_PROJECT_ID/getparking-api)

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Started Cloud Build: $BUILD_ID"
          gcloud builds describe "$BUILD_ID" --format='yaml(id,status,logUrl)'

      - name: Wait for Cloud Build
        run: |
          BUILD_ID="${{ steps.start-build.outputs.build_id }}"

          for attempt in {1..90}; do
            BUILD_STATUS=$(gcloud builds describe "$BUILD_ID" --format='value(status)')
            echo "Cloud Build status: $BUILD_STATUS"

            if [ "$BUILD_STATUS" = "SUCCESS" ]; then
              gcloud builds describe "$BUILD_ID" --format='yaml(status,results.images)'
              exit 0
            fi

            if [ "$BUILD_STATUS" = "FAILURE" ] || [ "$BUILD_STATUS" = "INTERNAL_ERROR" ] || [ "$BUILD_STATUS" = "TIMEOUT" ] || [ "$BUILD_STATUS" = "CANCELLED" ] || [ "$BUILD_STATUS" = "EXPIRED" ]; then
              gcloud builds describe "$BUILD_ID" --format='yaml(status,logUrl)'
              exit 1
            fi

            sleep 10
          done

          echo "Cloud Build did not finish within the expected time window."
          gcloud builds describe "$BUILD_ID" --format='yaml(status,logUrl)'
          exit 1

      - name: Deploy Cloud Run service
        run: >-
          gcloud run deploy $CLOUD_RUN_SERVICE
          --image gcr.io/$GCP_PROJECT_ID/getparking-api
          --platform managed
          --region $GCP_REGION
          --allow-unauthenticated
          --set-env-vars OPENAI_MODEL=$OPENAI_MODEL
          --set-secrets OPENAI_API_KEY=OPENAI_API_KEY:latest

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_PARKING_API_BASE_URL: ${{ vars.VITE_PARKING_API_BASE_URL }}
        run: npm run build

      - name: Deploy Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive