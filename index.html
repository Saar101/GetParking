<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var isAppleMobile = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (!isAppleMobile) {
          return;
        }

        var viewportMeta = document.querySelector('meta[name="viewport"]');
        if (!viewportMeta) {
          return;
        }

        var content = viewportMeta.getAttribute('content') || '';
        if (content.indexOf('maximum-scale=1') === -1) {
          viewportMeta.setAttribute('content', content + ', maximum-scale=1');
        }
      })();
    </script>
    <title>getparking</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
